# Install the two builds as below; Nest listens privately on port 3000.
server {
    listen 80;
    server_name blog.example.com;
    root /srv/aiblog/public;
    index index.html;
    client_max_body_size 20m;

    location = /admin { return 308 /admin/; }
    location = /api { return 308 /api/; }
    location /api/ {
        # Trailing slash strips /api/ before forwarding to Nest's root routes.
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location = /admin/index.html { add_header Cache-Control "no-cache" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location /admin/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /admin/tinymce-resource/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location / { try_files $uri $uri/ /index.html; }
}
